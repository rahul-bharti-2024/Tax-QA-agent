version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg15-trixie
    container_name: tax-pg
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
